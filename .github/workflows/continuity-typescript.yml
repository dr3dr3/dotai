name: Continuity TypeScript

on:
  pull_request:
    paths:
      - .github/workflows/continuity-typescript.yml
      - skills/wip-tracker/**
  push:
    branches: [main]
    paths:
      - .github/workflows/continuity-typescript.yml
      - skills/wip-tracker/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline continuity checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/wip-tracker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: skills/wip-tracker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
